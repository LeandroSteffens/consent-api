# Nome da aplicação
spring.application.name=consent-api

# Conexão com o MongoDB local que subimos no Docker
spring.data.mongodb.uri=mongodb://localhost:27017/consent_db

# Configuração para o Swagger aparecer na raiz (opcional, mas facilita)
springdoc.swagger-ui.path=/swagger-ui.html

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================
# Configurações JWT
# ============================
# Secret key codificada em Base64 (mínimo 256 bits para HS256)
# IMPORTANTE: Em produção, use variáveis de ambiente (ex: ${JWT_SECRET})
jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGp3dCBhdXRoZW50aWNhdGlvbg==

# Tempo de expiração do Access Token em milissegundos (30 minutos = 1800000ms)
jwt.access-token-expiration=1800000

# Tempo de expiração do Refresh Token em milissegundos (7 dias = 604800000ms)
jwt.refresh-token-expiration=604800000