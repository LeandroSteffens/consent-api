server:
  port: 8082

spring:
  application:
    name: consent-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/consent_db
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGp3dCBhdXRoZW50aWNhdGlvbg==}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.sensedia.consent: DEBUG
